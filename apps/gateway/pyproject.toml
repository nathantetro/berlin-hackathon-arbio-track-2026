[project]
name = "arbie-gateway"
version = "0.1.0"
description = "Arbie Gateway - FastAPI server for email webhook notifications"
requires-python = ">=3.12"
dependencies = [
    "tower[iceberg]>=0.3.43",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "msal>=1.32.0",
    "pydantic>=2.12.0",
    "openai-agents>=0.7.0",
    "openai>=2.15.0",
    "python-dateutil>=2.9.0",
    "mailersend>=2.0.0",
    "tavily-python>=0.7.19",
    "weasyprint>=68.0",
    "pillow>=12.1.0",
]
