[project]
name = "arbie"
version = "0.1.0"
description = "Arbie - Email gateway and AI property onboarding agent"
requires-python = ">=3.12"
dependencies = [
    "tower[iceberg]>=0.3.43",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "msal>=1.32.0",
    "pydantic>=2.12.0",
    "openai-agents>=0.7.0",
    "openai>=2.15.0",
    "python-dateutil>=2.9.0",
    "resend>=2.0.0",
    "tavily-python>=0.7.19",
    "weasyprint>=68.0",
    "pillow>=12.1.0",
    "pillow-heif>=0.21.0",  # HEIC/HEIF support
    # Azure Blob Storage
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.15.0",
    "aiohttp>=3.9.0",
    # Data processing (required by agent)
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "mistralai>=1.0.0",
]
