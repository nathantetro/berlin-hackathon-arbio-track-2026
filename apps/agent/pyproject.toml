[project]
name = "arbie-agent"
version = "0.1.0"
description = "Arbie Agent - AI property onboarding agent runner"
requires-python = ">=3.12"
dependencies = [
    "tower[iceberg]>=0.3.43",
    "openai-agents>=0.7.0",
    "openai>=2.15.0",
    "pydantic>=2.12.0",
    "tavily-python>=0.7.19",
    "resend>=2.0.0",
    "weasyprint>=68.0",
    "pillow>=12.1.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.28.0",
    "msal>=1.32.0",
    # Azure Blob Storage
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.15.0",
    # Data processing (required by arbie.services.email_processor)
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    # Tracing
    "keywordsai-sdk>=0.4.39",
]
